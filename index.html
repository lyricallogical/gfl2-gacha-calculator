<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ドールズフロントライン2 ガチャ期待値計算機</title>
<style>
  :root{
    --bg:#12140f;
    --panel:#1a1d15;
    --panel-2:#20241a;
    --line:#3a4030;
    --amber:#c9a24b;
    --amber-dim:#8a7238;
    --green:#8fae5e;
    --red:#b5583f;
    --ink:#e8e4d4;
    --ink-dim:#9a9789;
    --mono: "IBM Plex Mono","SFMono-Regular",Consolas,monospace;
    --sans: "IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      linear-gradient(180deg, rgba(0,0,0,0.15), rgba(0,0,0,0.35)),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px),
      var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    min-height:100vh;
    padding:28px 20px 60px;
  }
  .wrap{max-width:1180px;margin:0 auto;}

  /* Header */
  header{
    display:flex; justify-content:space-between; align-items:flex-end;
    border-bottom:2px solid var(--amber-dim);
    padding-bottom:14px; margin-bottom:22px; gap:16px; flex-wrap:wrap;
  }
  .brand-eyebrow{
    font-family:var(--mono); font-size:11px; letter-spacing:.18em;
    color:var(--amber); text-transform:uppercase; margin-bottom:6px;
  }
  h1{
    margin:0; font-size:26px; font-weight:700; letter-spacing:.01em;
    color:var(--ink);
  }
  h1 small{display:block; font-family:var(--mono); font-size:12px; font-weight:400; color:var(--ink-dim); margin-top:4px; letter-spacing:.02em;}
  .stamp{
    font-family:var(--mono); font-size:11px; color:var(--ink-dim);
    text-align:right; line-height:1.6; letter-spacing:.03em;
  }
  .stamp b{color:var(--amber);}

  /* Layout */
  .grid{display:grid; grid-template-columns: 340px 1fr; gap:20px;}
  @media (max-width:880px){ .grid{grid-template-columns:1fr;} }

  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    position:relative;
  }
  .panel::before{
    content:""; position:absolute; top:0; left:0; width:22px; height:22px;
    border-top:1px solid var(--amber-dim); border-left:1px solid var(--amber-dim);
  }
  .panel::after{
    content:""; position:absolute; bottom:0; right:0; width:22px; height:22px;
    border-bottom:1px solid var(--amber-dim); border-right:1px solid var(--amber-dim);
  }
  .panel-head{
    font-family:var(--mono); font-size:11px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--amber); padding:14px 18px 10px; border-bottom:1px solid var(--line);
  }
  .panel-body{padding:16px 18px 20px;}

  /* Form controls */
  .field{margin-bottom:14px;}
  .field label{
    display:flex; justify-content:space-between; align-items:baseline;
    font-family:var(--mono); font-size:11.5px; color:var(--ink-dim);
    letter-spacing:.03em; margin-bottom:5px;
  }
  .field label .val{color:var(--amber); font-weight:600;}
  input[type=number], select{
    width:100%; background:#0e100b; border:1px solid var(--line); color:var(--ink);
    font-family:var(--mono); font-size:13px; padding:8px 10px; border-radius:2px;
  }
  input[type=number]:focus, select:focus{outline:1px solid var(--amber); border-color:var(--amber);}
  input[type=range]{width:100%; accent-color:var(--amber);}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .toggle{
    display:flex; align-items:center; gap:9px; font-family:var(--mono); font-size:12px;
    color:var(--ink); padding:9px 10px; background:#0e100b; border:1px solid var(--line);
    cursor:pointer; user-select:none; margin-bottom:10px;
  }
  .toggle input{accent-color:var(--amber); width:15px; height:15px;}
  .preset-btns{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:16px;}
  .preset-btns button{
    font-family:var(--mono); font-size:11px; letter-spacing:.05em; padding:9px 6px;
    background:#0e100b; color:var(--ink-dim); border:1px solid var(--line); cursor:pointer;
    text-transform:uppercase; transition:.12s;
  }
  .preset-btns button.active{color:var(--bg); background:var(--amber); border-color:var(--amber);}
  .preset-btns button:hover{border-color:var(--amber);}
  .note{font-family:var(--mono); font-size:10.5px; color:var(--ink-dim); line-height:1.6; margin-top:10px; border-top:1px dashed var(--line); padding-top:10px;}

  .runbtn{
    width:100%; margin-top:6px; padding:13px; background:var(--amber); color:#141508;
    border:none; font-family:var(--mono); font-weight:700; font-size:13px; letter-spacing:.1em;
    text-transform:uppercase; cursor:pointer;
  }
  .runbtn:hover{background:#dab35c;}

  /* Results */
  .summary-cards{display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--line); border:1px solid var(--line); margin-bottom:20px;}
  .card{background:var(--panel); padding:16px 16px;}
  .card .label{font-family:var(--mono); font-size:10.5px; color:var(--ink-dim); letter-spacing:.08em; text-transform:uppercase; margin-bottom:8px;}
  .card .num{font-family:var(--mono); font-size:26px; font-weight:700; color:var(--amber); line-height:1;}
  .card .sub{font-family:var(--mono); font-size:11px; color:var(--ink-dim); margin-top:6px;}

  table{width:auto; border-collapse:collapse; font-family:var(--mono); font-size:11.5px;}
  th,td{padding:9px 8px; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap;}
  th:first-child, td:first-child{text-align:left; width:64px;}
  th{color:var(--amber); font-weight:600; letter-spacing:.03em; font-size:11px; text-transform:uppercase; border-bottom:1px solid var(--amber-dim);}
  tbody tr:hover{background:var(--panel-2);}
  td.highlight{color:var(--green); font-weight:600;}
  /* percentile columns: white (good/low pulls) -> gray (worse/high pulls) */
  td:nth-child(3){color:#ffffff;}
  td:nth-child(4){color:#e6e4dc;}
  td:nth-child(5){color:#d3d1c6;}
  td:nth-child(6){color:#bfbdb1;}
  td:nth-child(7){color:#acaa9d;}
  td:nth-child(8){color:#989688;}
  td:nth-child(9){color:#847f72;}
  /* header gradient: 99% = base amber, brighter toward 10% */
  th:nth-child(3){color:#fff8e6;}
  th:nth-child(4){color:#f6eacc;}
  th:nth-child(5){color:#eddbb2;}
  th:nth-child(6){color:#e4cd99;}
  th:nth-child(7){color:#dbbf7f;}
  th:nth-child(8){color:#d2b065;}
  th:nth-child(9){color:#c9a24b;}

  .section-title{
    font-family:var(--mono); font-size:11px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--amber); margin:26px 0 10px; padding-bottom:8px; border-bottom:1px solid var(--line);
  }
  footer{
    margin-top:32px; padding-top:14px; border-top:1px solid var(--line);
    font-family:var(--mono); font-size:10.5px; color:var(--ink-dim); line-height:1.8;
  }
  footer a{color:#e5c169; text-decoration:none;}
  footer a:hover{text-decoration:underline;}
  footer .footer-links{margin-top:6px;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>ドールズフロントライン2 ガチャ期待値計算機</h1>
    </div>
  </header>

  <div class="grid">
    <!-- SETTINGS -->
    <div class="panel">
      <div class="panel-head">ガチャ仕様設定</div>
      <div class="panel-body">

        <div class="preset-btns">
          <button type="button" id="presetChar" class="active">人形<br>58 / 80連</button>
          <button type="button" id="presetWeap">武器<br>50 / 70連</button>
        </div>

        <input type="hidden" id="baseRate" value="0.6">
        <input type="hidden" id="softStart" value="58">
        <input type="hidden" id="hardPity" value="80">
        <div class="note" style="margin-top:0; border-top:none; padding-top:0;">
          SSR排出率：<span class="val" id="v_base">0.60</span>% / 排出率上昇：<span class="val" id="v_softStart">58</span>連以降 / 天井 <span class="val" id="v_hardPity">80</span>連
        </div>

        <div class="field">
          <label style="justify-content:flex-start; gap:6px;"><span id="v_softLabel">58</span>連以降の上昇率 <span class="val" id="v_inc">1.60</span> %（※推測値は1.6%）</label>
          <input type="range" id="increaseRate" min="0.1" max="10" step="0.1" value="1.6">
        </div>
      </div>
    </div>

    <!-- but settings continue into current status + run, still panel 01 area -->
    <div>
      <div class="panel" style="margin-bottom:20px;">
        <div class="panel-head">ガチャ試算設定</div>
        <div class="panel-body">
          <div class="row2">
            <div class="field">
              <label>現在のカウント <span class="val" id="v_curPity">0</span></label>
              <input type="range" id="curPity" value="0" min="0" max="79" step="1">
            </div>
            <div class="field">
              <label>試算回数</label>
              <input type="number" id="nPulls" value="80" min="1" max="5000">
            </div>
          </div>
          <div class="field">
            <label>目標PU数</label>
            <input type="number" id="targetX" value="1" min="1" max="20">
          </div>
          <label class="toggle">
            <input type="checkbox" id="guaranteed">
            次回SSRはPU確定
          </label>
          <button class="runbtn" id="runBtn">計算</button>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head">計算結果</div>
        <div class="panel-body">
          <div class="summary-cards">
            <div class="card">
              <div class="label">SSR獲得期待値</div>
              <div class="num" id="outSSR">–</div>
              <div class="sub">体</div>
            </div>
            <div class="card">
              <div class="label">PU獲得期待値</div>
              <div class="num" id="outPU">–</div>
              <div class="sub">体</div>
            </div>
            <div class="card">
              <div class="label">目標PU数獲得率</div>
              <div class="num" id="outAtLeastX">–</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="section-title" id="fortSectionTitle">凸段階別 必要回数（V0〜V6）</div>
  <div class="panel">
    <div class="panel-body" style="padding:0; overflow-x:auto;">
      <table>
        <thead>
          <tr>
            <th id="fortColHead">凸段階</th><th>期待回数</th><th>10%</th><th>25%</th><th>50%</th><th>75%</th><th>90%</th><th>95%</th><th>99%</th>
          </tr>
        </thead>
        <tbody id="fortTable"></tbody>
      </table>
    </div>
  </div>

  <footer>
    ※ 本ツールは実際の排出結果を保証するものではありません。
    <div class="footer-links">
      CONTACT: <a href="https://x.com/LRLG_game" target="_blank" rel="noopener">@LRLG_game</a>
      　／　不具合報告: <a href="https://github.com/lyricallogical/gfl2-gacha-calculator/issues" target="_blank" rel="noopener">GitHub Issues</a>
    </div>
  </footer>

</div>

<script>
(function(){
  const $ = id => document.getElementById(id);

  const baseRateEl = $('baseRate'), softStartEl = $('softStart'), hardPityEl = $('hardPity'),
        increaseRateEl = $('increaseRate'),
        curPityEl = $('curPity'), nPullsEl = $('nPulls'), guaranteedEl = $('guaranteed'),
        targetXEl = $('targetX');

  function syncLabels(){
    $('v_base').textContent = parseFloat(baseRateEl.value || 0).toFixed(2);
    $('v_inc').textContent = parseFloat(increaseRateEl.value || 0).toFixed(2);
    $('v_softStart').textContent = softStartEl.value;
    $('v_hardPity').textContent = hardPityEl.value;
    $('v_curPity').textContent = curPityEl.value;
    $('v_softLabel').textContent = softStartEl.value;
  }
  [baseRateEl, increaseRateEl, curPityEl].forEach(el=>el.addEventListener('input', syncLabels));
  syncLabels();

  // Presets
  let isWeapon = false;
  let nPullsTouched = false;
  nPullsEl.addEventListener('input', ()=>{ nPullsTouched = true; });
  function setPreset(base, soft, hard){
    baseRateEl.value = base; softStartEl.value = soft; hardPityEl.value = hard;
    curPityEl.max = hard - 1;
    if (parseInt(curPityEl.value,10) > hard - 1) curPityEl.value = hard - 1;
    if (!nPullsTouched) nPullsEl.value = hard;
    syncLabels();
    updateFortHeaders();
    run();
  }
  function updateFortHeaders(){
    if (isWeapon){
      $('fortSectionTitle').textContent = '段階別 必要回数（R1〜R6）';
      $('fortColHead').textContent = '段階';
    } else {
      $('fortSectionTitle').textContent = '凸段階別 必要回数（V0〜V6）';
      $('fortColHead').textContent = '凸段階';
    }
  }
  $('presetChar').addEventListener('click', ()=>{
    isWeapon = false;
    setPreset(0.6, 58, 80);
    $('presetChar').classList.add('active'); $('presetWeap').classList.remove('active');
  });
  $('presetWeap').addEventListener('click', ()=>{
    isWeapon = true;
    setPreset(0.7, 50, 70);
    $('presetWeap').classList.add('active'); $('presetChar').classList.remove('active');
  });

  function getParams(){
    return {
      baseRate: parseFloat(baseRateEl.value)/100,
      softStart: parseInt(softStartEl.value,10),
      hardPity: parseInt(hardPityEl.value,10),
      increaseRate: parseFloat(increaseRateEl.value)/100,
      use5050: true,
      puChance: 0.5
    };
  }

  // rate for the n-th pull within the current no-SSR streak (n = pity_before + 1)
  function rateAtPull(n, p){
    if (n >= p.hardPity) return 1;
    if (n > p.softStart){
      const steps = n - p.softStart;
      return Math.min(1, p.baseRate + p.increaseRate*steps);
    }
    return p.baseRate;
  }

  // Absorbing DP: distribution of "pulls until PU obtained" starting from (startPity,startGuaranteed)
  // returns Float64Array where index i = P(absorbed exactly at pull i), length maxLen+1
  function puDistribution(startPity, startGuaranteed, p, maxLen){
    const dist = new Float64Array(maxLen+1);
    let current = new Map();
    current.set(startPity+'_'+(startGuaranteed?1:0), 1.0);
    for (let t=1; t<=maxLen; t++){
      const next = new Map();
      let puMass = 0;
      for (const [key, mass] of current){
        if (mass <= 1e-15) continue;
        const parts = key.split('_');
        const pity = parseInt(parts[0],10), g = parts[1]==='1';
        const n = pity+1;
        const rate = rateAtPull(n, p);
        const puProbThis = p.use5050 ? (g?1:p.puChance) : 1;
        const ssrPU = rate*puProbThis;
        const ssrNonPU = p.use5050 ? rate*(g?0:(1-p.puChance)) : 0;
        const noSSR = 1-rate;
        puMass += mass*ssrPU;
        if (ssrNonPU > 1e-15){
          const k2 = '0_1';
          next.set(k2,(next.get(k2)||0)+mass*ssrNonPU);
        }
        if (noSSR > 1e-15 && n < p.hardPity){
          const k3 = n+'_'+(g?1:0);
          next.set(k3,(next.get(k3)||0)+mass*noSSR);
        }
      }
      dist[t] = puMass;
      current = next;
      let remain = 0; for (const v of current.values()) remain+=v;
      if (remain < 1e-12) break;
    }
    return dist;
  }

  // Non-absorbing DP over N pulls: returns {expSSR, expPU, cumAtLeast1}
  function summaryOverN(N, startPity, startGuaranteed, p){
    let current = new Map();
    current.set(startPity+'_'+(startGuaranteed?1:0), 1.0);
    let expSSR = 0, expPU = 0;
    let neverPU = 1.0; // track prob of zero PU so far (needs separate absorbing-style tracking)
    // We track "no PU yet" mass separately using absorbing chain in parallel
    let aliveNoPU = new Map();
    aliveNoPU.set(startPity+'_'+(startGuaranteed?1:0), 1.0);

    for (let t=1; t<=N; t++){
      // non-absorbing update
      const next = new Map();
      let ssrTotal=0, puTotal=0;
      for (const [key, mass] of current){
        if (mass<=1e-15) continue;
        const parts = key.split('_');
        const pity = parseInt(parts[0],10), g = parts[1]==='1';
        const n = pity+1;
        const rate = rateAtPull(n,p);
        const puProbThis = p.use5050 ? (g?1:p.puChance) : 1;
        const ssrPU = rate*puProbThis;
        const ssrNonPU = p.use5050 ? rate*(g?0:(1-p.puChance)) : 0;
        const noSSR = 1-rate;
        ssrTotal += mass*rate;
        puTotal += mass*ssrPU;
        if (ssrPU>1e-15) next.set('0_0',(next.get('0_0')||0)+mass*ssrPU);
        if (ssrNonPU>1e-15) next.set('0_1',(next.get('0_1')||0)+mass*ssrNonPU);
        if (noSSR>1e-15 && n<p.hardPity) next.set(n+'_'+(g?1:0),(next.get(n+'_'+(g?1:0))||0)+mass*noSSR);
      }
      expSSR += ssrTotal; expPU += puTotal;
      current = next;

      // absorbing update for "no PU yet"
      const nextAlive = new Map();
      let absorbed = 0;
      for (const [key, mass] of aliveNoPU){
        if (mass<=1e-15) continue;
        const parts = key.split('_');
        const pity = parseInt(parts[0],10), g = parts[1]==='1';
        const n = pity+1;
        const rate = rateAtPull(n,p);
        const puProbThis = p.use5050 ? (g?1:p.puChance) : 1;
        const ssrPU = rate*puProbThis;
        const ssrNonPU = p.use5050 ? rate*(g?0:(1-p.puChance)) : 0;
        const noSSR = 1-rate;
        absorbed += mass*ssrPU;
        if (ssrNonPU>1e-15) nextAlive.set('0_1',(nextAlive.get('0_1')||0)+mass*ssrNonPU);
        if (noSSR>1e-15 && n<p.hardPity) nextAlive.set(n+'_'+(g?1:0),(nextAlive.get(n+'_'+(g?1:0))||0)+mass*noSSR);
      }
      neverPU -= absorbed;
      aliveNoPU = nextAlive;
    }
    return { expSSR, expPU, atLeast1: 1-neverPU };
  }

  function convolve(a, b, maxLen){
    const result = new Float64Array(maxLen+1);
    for (let i=1;i<=maxLen;i++){
      let s=0;
      const jmax = Math.min(i-1, b.length-1);
      for (let j=1;j<=jmax;j++){
        const av = a[i-j];
        if (av) s += av*b[j];
      }
      result[i]=s;
    }
    return result;
  }

  function percentileFromDist(dist, threshold){
    let cum=0;
    for (let i=1;i<dist.length;i++){
      cum+=dist[i];
      if (cum>=threshold) return i;
    }
    return null; // not reached within computed range
  }
  function expectedFromDist(dist){
    let e=0, total=0;
    for (let i=1;i<dist.length;i++){ e+=i*dist[i]; total+=dist[i]; }
    return total>1e-9 ? e/total : null; // conditional expectation if some mass unresolved is fine given total~1
  }

  function fmtInt(x){ return x===null ? '—' : x.toLocaleString(); }
  function fmtPct(x){
    if (x >= 1 - 1e-9) return '100.0%';
    let pct = x*100;
    let str = pct.toFixed(1);
    if (parseFloat(str) >= 100) str = '99.9';
    return str + '%';
  }
  function fmtNum1(x){ return x===null ? '—' : x.toFixed(1); }

  function run(){
    const p = getParams();
    const N = Math.max(1, Math.min(5000, parseInt(nPullsEl.value,10)||1));
    const curPity = Math.max(0, Math.min(p.hardPity-1, parseInt(curPityEl.value,10)||0));
    const guaranteed = guaranteedEl.checked;
    const targetX = Math.max(1, Math.min(20, parseInt(targetXEl.value,10)||1));

    // 03 summary
    const summary = summaryOverN(N, curPity, guaranteed, p);
    $('outSSR').textContent = summary.expSSR.toFixed(2);
    $('outPU').textContent = summary.expPU.toFixed(2);

    // interval max length: worst case ~ 2x hardPity (lose 5050 once) + margin
    const intervalMax = p.hardPity*2 + 5;
    const firstMax = (p.hardPity - curPity) + p.hardPity + 5; // from current state, worst case

    const freshDist = puDistribution(0, false, p, intervalMax);
    const firstDist = puDistribution(curPity, guaranteed, p, Math.max(firstMax, intervalMax));

    // build distributions for k = 1..max(tableLevels, targetX) copies
    const thresholds = [0.10,0.25,0.50,0.75,0.90,0.95,0.99];
    const tableLevels = isWeapon ? 6 : 7;
    const kMax = Math.max(tableLevels, targetX);
    const rows = [];
    let runningDist = firstDist;
    const totalCap = firstDist.length + intervalMax*(kMax) + 10;
    let distForX = null;

    for (let k=1; k<=kMax; k++){
      // pad/convolve into a working copy sized to totalCap
      let distK;
      if (k===1){
        distK = new Float64Array(totalCap);
        for (let i=0;i<Math.min(firstDist.length,totalCap);i++) distK[i]=firstDist[i];
        runningDist = distK;
      } else {
        distK = convolve(runningDist, freshDist, totalCap-1);
        runningDist = distK;
      }
      if (k===targetX) distForX = distK;
      if (k<=tableLevels){
        const exp = expectedFromDist(distK);
        const percs = thresholds.map(th=>percentileFromDist(distK, th));
        rows.push({k, exp, percs});
      }
    }

    // P(X体以上獲得できる | N連) = P(X体目の獲得連数 <= N)
    let cumX = 0;
    for (let i=1; i<=Math.min(N, distForX.length-1); i++) cumX += distForX[i];
    $('outAtLeastX').textContent = fmtPct(cumX);

    const tbody = $('fortTable');
    tbody.innerHTML = '';
    const labels = isWeapon
      ? ['R1 (1本)','R2 (2本)','R3 (3本)','R4 (4本)','R5 (5本)','R6 (6本)']
      : ['V0 (1体)','V1 (2体)','V2 (3体)','V3 (4体)','V4 (5体)','V5 (6体)','V6 (7体)'];
    rows.forEach((r,idx)=>{
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${labels[idx]}</td>` +
        `<td class="highlight">${fmtNum1(r.exp)}</td>` +
        r.percs.map(v=>`<td>${fmtInt(v)}</td>`).join('');
      tbody.appendChild(tr);
    });
  }

  $('runBtn').addEventListener('click', run);
  updateFortHeaders();
  run();
})();
</script>
</body>
</html>
